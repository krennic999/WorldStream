<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">WorldStream — The world unfolds beneath your feet.</title>
  <desc id="desc">A dark mint-accented banner with an expanding world map and a route connecting persistent regions.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e22"/><stop offset="1" stop-color="#080d10"/></linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#26423e" stroke-width="1"/></pattern>
  </defs>
  <rect width="1280" height="380" rx="20" fill="url(#bg)"/>
  <rect x="734" y="0" width="546" height="380" fill="url(#grid)"/>
  <g transform="translate(815 78) rotate(-12 170 100)">
    <path d="M0 25H105V0H210V52H315V156H263V208H105V182H0Z" fill="#173831" stroke="#3e7965" stroke-width="2"/>
    <path d="M0 25H105V104H0Z" fill="#436b5c"/><path d="M105 0H210V104H105Z" fill="#708466"/><path d="M210 52H315V156H210Z" fill="#ac9064"/><path d="M105 104H210V208H105Z" fill="#315b49"/><path d="M210 156H263V208H210Z" fill="#326773"/>
    <g fill="#ced8d0"><rect x="16" y="42" width="20" height="22"/><rect x="45" y="42" width="18" height="34"/><rect x="73" y="42" width="17" height="22"/></g>
    <path d="M38 85L142 85L142 146L234 146L274 111" fill="none" stroke="#58f4c2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="38" cy="85" r="6" fill="#fff"/><circle cx="274" cy="111" r="8" fill="#58f4c2"/>
    <path d="M315 52H367V208H263" fill="none" stroke="#58f4c2" stroke-width="2" stroke-dasharray="7 8"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <path d="M48 57l12-12 12 12-12 12z" fill="#58f4c2"/>
    <text x="88" y="64" font-size="19" letter-spacing="4" font-weight="700" fill="#dce9e3">WORLDSTREAM</text>
    <text x="48" y="152" font-size="53" font-weight="700" fill="#fff">The world unfolds</text>
    <text x="48" y="216" font-size="53" font-weight="700" fill="#58f4c2">beneath your feet.</text>
    <text x="50" y="274" font-size="23" font-weight="700" fill="#fff">3D worlds, generated as you explore.</text>
