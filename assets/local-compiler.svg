  <g fill="none" stroke="#5bd9b3" stroke-width="5" stroke-linecap="round"><path d="M369 372h70"/><path d="M760 372h70"/></g>
  <g fill="#5bd9b3"><circle r="9"><animateMotion dur="2.4s" repeatCount="indefinite" path="M369 372h70"/></circle><circle r="9"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M760 372h70"/></circle></g>
